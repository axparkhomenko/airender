name: airender
services:
  ollama:
    image: ollama/ollama:latest
    container_name: airender-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [airender]
  ollama-model-init:
    image: ollama/ollama:latest
    container_name: airender-ollama-model-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama show \"$${OLLAMA_MODEL}\" >/dev/null 2>&1 || ollama pull \"$${OLLAMA_MODEL}\""]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [airender]
  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    container_name: airender-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set LITELLM_SALT_KEY in .env}
      OLLAMA_API_BASE: http://ollama:11434
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4001}:4000"
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    networks: [airender]
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: airender-open-webui
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      ENABLE_SIGNUP: "true"
    volumes:
      - openwebui_data:/app/backend/data
    ports:
      - "127.0.0.1:${OPENWEBUI_PORT:-3334}:8080"
    depends_on:
      - litellm
    networks: [airender]
  airender-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BLENDER_VERSION: "5.2.3"
    container_name: airender-api
    restart: unless-stopped
    working_dir: /workspace
    environment:
      AIR_RENDER_LLM_BASE_URL: http://litellm:4000/v1
      AIR_RENDER_LLM_API_KEY: ${LITELLM_MASTER_KEY}
      AIR_RENDER_LLM_MODEL: airender
      BLENDER_EXE: /opt/blender/blender
      AIR_RENDER_TIMEOUT_SECONDS: "1800"
    volumes:
      - ./:/workspace
    ports:
      - "127.0.0.1:${AIR_RENDER_API_PORT:-8765}:8000"
    depends_on:
      - litellm
    networks: [airender]
networks:
  airender:
    name: airender-net
    driver: bridge
volumes:
  ollama_data:
    name: airender_ollama_data
  openwebui_data:
    name: airender_openwebui_data
